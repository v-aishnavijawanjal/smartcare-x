<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ app_name }}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f4; font-family: Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f4; padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px; background-color:#ffffff; border-radius:10px; overflow:hidden;">

          <tr>
            <td style="background-color:#233D4C; padding:22px 28px;">
              <span style="color:#ffffff; font-size:20px; font-weight:bold; letter-spacing:0.5px;">{{ app_name }}</span>
            </td>
          </tr>

          <tr>
            <td style="padding:28px;">
              {% block content %}{% endblock %}
            </td>
          </tr>

          <tr>
            <td style="background-color:#FFD2C2; padding:16px 28px; font-size:12px; color:#233D4C;">
              This is an automated message from {{ app_name }}. Please do not reply to this email.
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
