{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    <div class="flash-stack mb-3">
      {% for category, message in messages %}
        <div class="alert alert-{{ 'danger' if category == 'danger' else category }} alert-dismissible fade show d-flex align-items-center"
             role="alert" style="border-radius: var(--sc-radius);">
          <i class="bi
            {% if category == 'success' %}bi-check-circle-fill
            {% elif category == 'danger' %}bi-exclamation-triangle-fill
            {% elif category == 'warning' %}bi-exclamation-circle-fill
            {% else %}bi-info-circle-fill{% endif %} me-2"></i>
          <span>{{ message }}</span>
          <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
