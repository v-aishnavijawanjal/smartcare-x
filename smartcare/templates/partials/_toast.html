<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080;">
  <div id="scToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true"
       style="background-color: var(--sc-dark); color: #fff; border-radius: var(--sc-radius);">
    <div class="d-flex">
      <div class="toast-body d-flex align-items-center gap-2">
        <i class="bi bi-bell-fill" style="color: var(--sc-primary);"></i>
        <span id="scToastMessage">Notification</span>
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>

<script>
  // Exposed globally so any page can call showToast("Saved!") after an
  // async action (e.g. AJAX slot booking) without a full page reload.
  function showToast(message) {
    const toastEl = document.getElementById('scToast');
    if (!toastEl) return;
    document.getElementById('scToastMessage').textContent = message;
    new bootstrap.Toast(toastEl, { delay: 3500 }).show();
  }
</script>
